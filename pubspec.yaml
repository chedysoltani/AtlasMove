name: atlasmove
description: Plateforme de transport et livraison - Alternative à Uber
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  http: ^1.1.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.5.3
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  intl: ^0.20.2
  flutter_stripe: ^12.6.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^6.1.0
  socket_io_client: ^2.0.3
  agora_rtc_engine: ^6.3.0
  qr_flutter: ^4.1.0
  easy_localization: ^3.0.7
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_foreground_task: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/new_logo_mobile.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/new_logo_mobile.png"


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
    - .env
