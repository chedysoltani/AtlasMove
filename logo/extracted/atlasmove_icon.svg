<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="orangeMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FF4500"/>
    </linearGradient>
    <linearGradient id="orangeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFA500"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#FF6B00" flood-opacity="0.5"/>
    </filter>
    <clipPath id="roundedRect">
      <rect width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- App icon rounded rect background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind icon -->
  <radialGradient id="centerGlow" cx="50%" cy="52%" r="40%">
    <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:0"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="230" fill="url(#centerGlow)"/>

  <!-- === ROAD / SPEED LINES at bottom === -->
  <!-- Road perspective lines -->
  <polygon points="512,680 180,900 844,900" fill="#1F1F1F"/>
  <line x1="512" y1="680" x2="512" y2="900" stroke="#FF6B00" stroke-width="4" stroke-dasharray="18,22" opacity="0.5"/>
  <line x1="512" y1="680" x2="270" y2="900" stroke="#333" stroke-width="2" opacity="0.6"/>
  <line x1="512" y1="680" x2="754" y2="900" stroke="#333" stroke-width="2" opacity="0.6"/>

  <!-- === MAIN ICON: Stylized forward arrow / A shape === -->
  <!-- Orange glow blob behind -->
  <ellipse cx="512" cy="430" rx="210" ry="190" fill="#FF6B00" opacity="0.12" filter="url(#glow)"/>

  <!-- Main shape: Bold upward chevron / rocket arrow -->
  <!-- Left wing -->
  <polygon points="512,170 310,590 390,590 512,320 634,590 714,590" fill="url(#orangeMain)" filter="url(#innerShadow)"/>

  <!-- Inner dark cutout to create hollow arrow / A feel -->
  <polygon points="512,295 432,510 592,510" fill="#111111"/>

  <!-- Bottom crossbar – speed bar -->
  <rect x="350" y="540" width="324" height="52" rx="26" fill="url(#orangeLight)"/>

  <!-- 3 speed dots below crossbar -->
  <circle cx="440" cy="638" r="14" fill="#FF6B00" opacity="0.9"/>
  <circle cx="512" cy="638" r="10" fill="#FF6B00" opacity="0.55"/>
  <circle cx="576" cy="638" r="7" fill="#FF6B00" opacity="0.28"/>

  <!-- Top shine overlay -->
  <rect width="1024" height="1024" rx="230" fill="url(#shine)"/>
</svg>
